seed: 42
lr: 7.0e-4
decay_rate: 0.985
lamb: 1.5e-4
epochs: 15
hidden_dim: 64
n_layer: 3
dropout: 0.08
n_batch: 30
n_tbatch: 30

PNA_delta: null

K: 400
K_neg: 30
item_bonus_init: 0.05

K_ppr: 40
ppr_topk: 12288
ppr_compute_bs: 128
ppr_device: auto
ppr_fallback_to_cpu: true

K_intent: 8
tuple_dropout: 0.25
slot_attn_iters: 3
slot_attn_eps: 1.0e-8
slot_attn_mlp_hidden: 128
slot_attn_use_input_ln: true
slot_attn_use_slot_ln: true
slot_attn_use_mlp_ln: true
slot_attn_use_gru: true
slot_attn_use_residual_mlp: true
slot_attn_learned_slot_init: true

tau_min: 1.0
tau_max: 1.5
tau_anneal_epochs: 15  # tau anneals from tau_max down to tau_min over this many epochs
tau_g: 1.2
pred_rank: 16

lambda_intent_div: 2.0e-3
