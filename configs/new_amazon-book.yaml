seed: 42
lr: 8.0e-4
decay_rate: 0.985
lamb: 1.0e-4
epochs: 20
hidden_dim: 48
n_layer: 3
dropout: 0.1
n_batch: 8
n_tbatch: 12

PNA_delta: null

K: 750
K_neg: 50
item_bonus_init: 0.05

K_ppr: 180
ppr_topk: 12288
ppr_compute_bs: 128
ppr_device: auto
ppr_fallback_to_cpu: true

K_intent: 6
tuple_dropout: 0.15
slot_attn_iters: 3
slot_attn_eps: 1.0e-8
slot_attn_mlp_hidden: 96
slot_attn_use_input_ln: true
slot_attn_use_slot_ln: true
slot_attn_use_mlp_ln: true
slot_attn_use_gru: true
slot_attn_use_residual_mlp: true
slot_attn_learned_slot_init: true

tau_min: 0.1
tau_max: 1.8
tau_anneal_epochs: 15  # tau reaches tau_max after this many epochs
tau_g: 1.2
pred_rank: 24

lambda_intent_div: 2.0e-3
lambda_centroid_ortho: 2.0e-3
